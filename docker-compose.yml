services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: suraksha
      POSTGRES_PASSWORD: suraksha
      POSTGRES_DB: suraksha
    ports: ["5432:5432"]
    volumes: [suraksha_pg:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://suraksha:suraksha@db:5432/suraksha
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    image: node:22
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [backend]
volumes:
  suraksha_pg:
