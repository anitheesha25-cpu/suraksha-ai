services:
  - type: web
    name: suraksha-ai-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: suraksha-ai-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://suraksha-ai-frontend.onrender.com
databases:
  - name: suraksha-ai-db
    plan: free
